<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="rsvp-page">
    <main class="rsvp-card">
      <p class="eyebrow">RSVP</p>
      <h1>Respond to invitation</h1>
      <p class="rsvp-greeting" id="greeting">Loading invitation…</p>
      <div class="choice-row">
        <button type="button" class="rsvp-choice selected" data-rsvp="confirmed">Confirm</button>
        <button type="button" class="rsvp-choice" data-rsvp="declined">Decline</button>
      </div>
      <div id="publicPartyControl">
        <p>Number of guests</p>
        <div class="stepper">
          <button type="button" id="minus" aria-label="Remove one guest">−</button>
          <strong id="partyNumber">1</strong>
          <button type="button" id="plus" aria-label="Add one guest">+</button>
        </div>
      </div>
      <button id="confirm" class="primary-button submit">Save response</button>
      <p id="rsvpMessage" class="rsvp-message" aria-live="polite"></p>
    </main>
    <script src="/rsvp.js"></script>
  </body>
</html>
