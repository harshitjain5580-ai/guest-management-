<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-page-title="Reset password">Guest Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/client/auth.css" />
    <script defer src="/client/brand.js"></script>
    <script defer src="/client/auth.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand auth-brand" href="/login"><span class="brand-mark" aria-hidden="true">G</span><span data-brand>Guest Manager</span></a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1>Reset password</h1>
      <p class="auth-copy">Choose a new password for your account.</p>
      <form class="auth-form" data-auth-form="reset" action="/api/auth/reset-password">
        <input type="hidden" name="token" id="resetToken" />
        <label for="password">New password
          <span class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required autofocus aria-describedby="passwordHelp" /><button class="password-toggle" type="button" data-password-toggle="password" aria-pressed="false">Show</button></span>
        </label>
        <p id="passwordHelp" class="auth-copy">Use at least 12 characters.</p>
        <button class="primary-button submit" type="submit">Reset password</button>
        <p class="form-message" data-message role="status" aria-live="polite"></p>
      </form>
      <nav class="auth-links" aria-label="Account"><a href="/login">Back to log in</a></nav>
    </main>
  </body>
</html>
