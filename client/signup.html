<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-page-title="Sign up">Guest Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/client/auth.css" />
    <script defer src="/client/brand.js"></script>
    <script defer src="/client/auth.js"></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand auth-brand" href="/login"><span class="brand-mark" aria-hidden="true">G</span><span data-brand>Guest Manager</span></a>
      <p class="eyebrow">CREATE ACCOUNT</p>
      <h1>Sign up</h1>
      <p class="auth-copy">Create an account to get started.</p>
      <form class="auth-form" data-auth-form="signup" action="/api/auth/signup">
        <label for="email">Email<input id="email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus /></label>
        <label for="password">Password
          <span class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required aria-describedby="passwordHelp" /><button class="password-toggle" type="button" data-password-toggle="password" aria-pressed="false">Show</button></span>
        </label>
        <p id="passwordHelp" class="auth-copy">Use at least 12 characters.</p>
        <button class="primary-button submit" type="submit">Sign up</button>
        <p class="form-message" data-message role="status" aria-live="polite"></p>
      </form>
      <nav class="auth-links" aria-label="Account">
        <a href="/login">Log in</a>
      </nav>
    </main>
  </body>
</html>
