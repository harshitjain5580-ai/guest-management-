services:
  - type: web
    name: wedding-guest-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/dashboard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-guest-manager-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
  - type: cron
    name: wedding-guest-reminders
    runtime: python
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python reminder_job.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-guest-manager-db
          property: connectionString
databases:
  - name: wedding-guest-manager-db
    databaseName: wedding_guests
    user: wedding_admin
