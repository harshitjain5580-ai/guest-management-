services:
  - type: web
    name: wedding-guest-manager
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-guest-manager-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
databases:
  - name: wedding-guest-manager-db
    databaseName: wedding_guests
    user: wedding_admin
