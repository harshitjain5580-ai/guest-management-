<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Sign in · Vows and Guests</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css" /></head>
<body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="/"><span class="brand-mark">V</span><span>Vows <i>&amp;</i> Guests</span></a><p class="eyebrow">ORGANIZER ACCESS</p><h1>Welcome back.</h1><p class="auth-copy">Sign in to manage your guest list, RSVP responses, and reminders.</p><form method="post" action="/login" class="auth-form"><label>Admin password<input autofocus required type="password" name="password" autocomplete="current-password" /></label><p class="auth-error" id="authError">That password does not match. Try again.</p><button class="primary-button submit" type="submit">Sign in to the dashboard</button></form><p class="auth-footnote">For the local demo, use <strong>demo-access</strong>. Set <code>ADMIN_PASSWORD</code> in Render before public use.</p></main><script>if (!new URLSearchParams(location.search).has('error')) document.getElementById('authError').hidden = true;</script></body></html>
